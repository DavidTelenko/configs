# yaml-language-server: $schema=./.manifest.schema.json
# cspell:disable
# Package manifest, consumed by `bootstrap.nu`.
# Field documentation lives in `.manifest.schema.json`.

platforms:
  linux:
    shell: [sh, -c]
    prepare: |
      if [ "$(id -u)" -eq 0 ]; then
        echo "run as a regular user, sudo is used where needed" >&2
        exit 1
      fi
      sudo -v
    path:
      - ~/.local/bin
      - ~/.cargo/bin
      - ~/go/bin
      - ~/.asdf/shims
  windows:
    shell: [powershell, -NoProfile, -Command]
    path: [~/scoop/shims]
  macos:
    shell: [sh, -c]
    prepare: |
      if [ "$(id -u)" -eq 0 ]; then
        echo "run as a regular user, homebrew refuses to run as root" >&2
        exit 1
      fi
    path:
      - /opt/homebrew/bin
      - /usr/local/bin
      # rustup is keg-only in homebrew
      - /opt/homebrew/opt/rustup/bin
      - /usr/local/opt/rustup/bin
      - ~/.local/bin
      - ~/.cargo/bin
      - ~/go/bin
      - ~/.asdf/shims

systems:
  arch:
    platform: linux
    match: [arch, endeavouros, manjaro, cachyos, garuda, artix]
    managers: [pacman, yay, am, cargo, go, asdf, script]
  fedora:
    platform: linux
    match: [fedora, nobara, ultramarine]
    managers: [dnf, am, cargo, go, asdf, script]
  ubuntu:
    platform: linux
    match: [ubuntu, pop, linuxmint, elementary, zorin, neon]
    managers: [apt, am, cargo, go, asdf, script]
  windows:
    platform: windows
    managers: [scoop, winget, powershell]
  macos:
    platform: macos
    managers: [brew, cask, cargo, go, asdf, script]

managers:
  pacman:
    setup: sudo pacman -Syu --noconfirm
    refresh: sudo pacman -Sy
    install: sudo pacman -S --needed --noconfirm {pkgs}
    repos:
      multilib:
        check: grep -q '^\[multilib\]' /etc/pacman.conf
        run: sudo sed -i '/^#\[multilib\]/,/^#Include/ s/^#//' /etc/pacman.conf

  yay:
    requires: [git, base-devel]
    check: command -v yay
    setup: |
      tmp="$(mktemp -d)"
      git clone --depth 1 https://aur.archlinux.org/yay-bin.git "$tmp"
      (cd "$tmp" && makepkg -si --noconfirm)
      rm -rf "$tmp"
    install: yay -S --needed --noconfirm {pkgs}

  dnf:
    setup: sudo dnf install -y 'dnf-command(copr)'
    install: sudo dnf install -y {pkgs}
    repos:
      rpmfusion-free:
        check: rpm -q rpmfusion-free-release
        run: sudo dnf install -y "https://download1.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm"
      rpmfusion-nonfree:
        check: rpm -q rpmfusion-nonfree-release
        run: sudo dnf install -y "https://download1.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-$(rpm -E %fedora).noarch.rpm"
      copr-coolercontrol:
        run: sudo dnf copr enable -y codifryed/CoolerControl
      copr-ghostty:
        run: sudo dnf copr enable -y rivenirvana/ghostty
      copr-hyprland:
        run: sudo dnf copr enable -y solopasha/hyprland
      copr-keyd:
        run: sudo dnf copr enable -y alternateved/keyd
      copr-neovim-nightly:
        run: sudo dnf copr enable -y agriffis/neovim-nightly
      copr-zen-browser:
        run: sudo dnf copr enable -y sneexy/zen-browser

  apt:
    setup: sudo apt-get update && sudo apt-get install -y software-properties-common curl gpg
    refresh: sudo apt-get update
    install: sudo apt-get install -y {pkgs}
    repos:
      coolercontrol:
        check: ls /etc/apt/sources.list.d/coolercontrol-coolercontrol.*
        run: curl -1sLf https://dl.cloudsmith.io/public/coolercontrol/coolercontrol/setup.deb.sh | sudo -E bash
      fury-nushell:
        check: test -f /etc/apt/sources.list.d/fury-nushell.list
        run: |
          curl -fsSL https://apt.fury.io/nushell/gpg.key | sudo gpg --yes --dearmor -o /usr/share/keyrings/fury-nushell.gpg
          echo "deb [signed-by=/usr/share/keyrings/fury-nushell.gpg] https://apt.fury.io/nushell/ /" | sudo tee /etc/apt/sources.list.d/fury-nushell.list
      fury-wezterm:
        check: test -f /etc/apt/sources.list.d/wezterm.list
        run: |
          curl -fsSL https://apt.fury.io/wez/gpg.key | sudo gpg --yes --dearmor -o /usr/share/keyrings/wezterm-fury.gpg
          echo "deb [signed-by=/usr/share/keyrings/wezterm-fury.gpg] https://apt.fury.io/wez/ * *" | sudo tee /etc/apt/sources.list.d/wezterm.list
      ppa-neovim:
        run: sudo add-apt-repository -y -n ppa:neovim-ppa/unstable
      tailscale:
        check: test -f /etc/apt/sources.list.d/tailscale.list
        run: |
          . /etc/os-release
          curl -fsSL "https://pkgs.tailscale.com/stable/$ID/$VERSION_CODENAME.noarmor.gpg" | sudo tee /usr/share/keyrings/tailscale-archive-keyring.gpg >/dev/null
          curl -fsSL "https://pkgs.tailscale.com/stable/$ID/$VERSION_CODENAME.tailscale-keyring.list" | sudo tee /etc/apt/sources.list.d/tailscale.list

  am:
    requires: [curl, wget, unzip, binutils]
    check: command -v am
    setup: |
      tmp="$(mktemp)"
      curl -fsSL -o "$tmp" https://raw.githubusercontent.com/ivan-hc/AM/main/INSTALL
      chmod a+x "$tmp"
      sudo "$tmp"
      rm -f "$tmp"
    install: am -i {pkgs}

  cargo:
    requires: [rustup, base-devel]
    setup: |
      command -v rustup >/dev/null || rustup-init -y --no-modify-path
      rustup default stable
    install: cargo install --locked {pkg}

  go:
    requires: [go]
    install: go install {pkg}

  asdf:
    requires: [go, git]
    check: command -v asdf
    setup: go install github.com/asdf-vm/asdf/cmd/asdf@v0.20.0
    install: |
      asdf plugin list | grep -qx '{pkg}' || asdf plugin add '{pkg}'
      asdf install '{pkg}' latest
      asdf set --home '{pkg}' "$(asdf latest '{pkg}')"

  # entries are shell commands: `script: <command>` or `script: { run, check? }`
  script: {}

  scoop:
    check: if (-not (Get-Command scoop -ErrorAction SilentlyContinue)) { exit 1 }
    setup: |
      Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
      Invoke-Expression "& { $(Invoke-RestMethod get.scoop.sh) } -RunAsAdmin"
      scoop install git
    install: scoop install {pkgs}; exit $LASTEXITCODE
    repos:
      extras:
        check: if ((scoop bucket list).Name -notcontains 'extras') { exit 1 }
        run: scoop bucket add extras
      games:
        check: if ((scoop bucket list).Name -notcontains 'games') { exit 1 }
        run: scoop bucket add games
      nerd-fonts:
        check: if ((scoop bucket list).Name -notcontains 'nerd-fonts') { exit 1 }
        run: scoop bucket add nerd-fonts
      sysinternals:
        check: if ((scoop bucket list).Name -notcontains 'sysinternals') { exit 1 }
        run: scoop bucket add sysinternals
      versions:
        check: if ((scoop bucket list).Name -notcontains 'versions') { exit 1 }
        run: scoop bucket add versions

  winget:
    check: if (-not (Get-Command winget -ErrorAction SilentlyContinue)) { exit 1 }
    install: winget install --id {pkg} --exact --silent --accept-source-agreements --accept-package-agreements; exit $LASTEXITCODE

  # entries are powershell commands: `powershell: <command>` or `powershell: { run, check? }`
  powershell: {}

  brew:
    check: command -v brew
    setup: /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
    install: brew install {pkgs}

  cask:
    check: command -v brew
    install: brew install --cask {pkgs}

