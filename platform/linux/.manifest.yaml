  tuicr:
    pacman: true
    cargo: true
  vivid:
    pacman: true
    apt: true
    cargo: true
  zoxide:
    pacman: true
    dnf: true
    apt: true
    am: true

  # editors

  helix:
    pacman: true
    dnf: true
    am: true
  neovim:
