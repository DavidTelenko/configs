  mangohud:
    pacman: true
    dnf: true
    apt: true
  pavucontrol:
    pacman: true
    dnf: true
    apt: true
  playerctl:
    pacman: true
    dnf: true
    apt: true
  tailscale:
    pacman: true
    dnf: true
    apt: { repo: tailscale }

  # desktop

  dunst:
    pacman: true
    dnf: true
    apt: true
  grim:
    pacman: true
    dnf: true
    apt: true
  hypridle:
    pacman: true
    dnf: { repo: copr-hyprland }
    apt: true
  hyprland:
    pacman: true
    dnf: { repo: copr-hyprland }
    apt: true
  hyprland-per-window-layout:
    # configs/hypr/startup.conf runs it from ~/.cargo/bin
    cargo: true
  hyprlock:
    pacman: true
    dnf: { repo: copr-hyprland }
    apt: true
  hyprsunset:
    pacman: true
    dnf: { repo: copr-hyprland }
  rofi:
    pacman: true
    dnf: true
    apt: true
  slurp:
    pacman: true
    dnf: true
    apt: true
  swww:
    # renamed to awww upstream, arch ships `awww` only (binary `awww-daemon`)
    pacman: awww
    dnf: { repo: copr-hyprland }
  waybar:
    pacman: true
    dnf: true
    apt: true
  wf-recorder:
    pacman: true
    dnf: true
    apt: true
  wl-clipboard:
    pacman: true
    dnf: true
    apt: true

  # terminal

  alacritty:
    pacman: true
    dnf: true
    apt: true
    am: true
  foot:
    pacman: true
    dnf: true
    apt: true
    am: true
    prefer: { fedora: am }
  ghostty:
    pacman: true
    dnf: { repo: copr-ghostty }
    apt: true
    am: true
  kitty:
    pacman: true
    dnf: true
    apt: true
    am: true
  wezterm:
    pacman: true
    apt: { repo: fury-wezterm }
    am: true
  nushell:
    pacman: true
    dnf: true
    apt: { repo: fury-nushell }
    am: nu
  oh-my-posh:
    yay: oh-my-posh-bin
    dnf: true
    script:
      check: command -v oh-my-posh
      run: curl -fsSL https://ohmyposh.dev/install.sh | bash -s -- -d "$HOME/.local/bin"
  tmux:
