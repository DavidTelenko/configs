    dnf: true
    apt: true
  zellij:
    pacman: true
    am: true
    cargo: true

  # cli

  aria2:
    pacman: true
    dnf: true
    apt: true
  fd:
    pacman: true
    dnf: fd-find
    apt: fd-find
    am: true
  ripgrep:
    pacman: true
    dnf: true
    apt: true
    am: true
  tgpt:
