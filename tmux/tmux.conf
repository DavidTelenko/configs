# -- general -------------------------------------------------------------------
unbind C-b
set -g prefix M-e
bind-key M-a send-prefix

# Undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

%if #{>=:#{version},3.2}
set -g extended-keys #{?#{||:#{m/ri:mintty|iTerm,#{TERM_PROGRAM}},#{!=:#{XTERM_VERSION},}},on,off} # needed by Control + Shift bindings
%endif
set -s escape-time 10                     # faster command sequences
set -sg repeat-time 600                   # increase repeat timeout
set -s focus-events on

set -q -g status-utf8 on                  # expect UTF-8 (tmux < 2.2)
setw -q -g utf8 on

set -g history-limit 5000                 # boost history

# edit configuration
bind e new-window -n "tmux.conf" sh -c '${EDITOR:-vim} ~/.config/tmux/tmux.conf && tmux source-file ~/.config/tmux/tmux.conf' \; display "tmux.conf reloaded"

# reload configuration
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"


# -- display -------------------------------------------------------------------

# Gruvbox color palette (matching wezterm)
black="#000000"
dark0="#282828"
dark1="#3c3836"
light2="#d5c4a1"
light3="#bdae93"
bright_yellow="#fabd2f"
bright_green="#b8bb26"

set -g status-position top
set -g status-style "bg=$black"
set -g status-interval 5

# Status left: mode indicator + session name (similar to tabline_a + tabline_b)
# Mode indicator changes color: light2 for normal (N), bright_yellow for prefix (P)
# The separator fg color should match the section background it's "drawing"
set -g status-left "#[bg=#{?client_prefix,$bright_yellow,$light2},fg=$dark0,bold] #{?client_prefix,,N} #[fg=#{?client_prefix,$bright_yellow,$light2},bg=$dark1]#[bg=$dark1,fg=$light2] 󰮫 #S #[fg=$dark1,bg=default]"
set -g status-left-length 50

# Status right: git branch + time/date (similar to tabline_x + tabline_y)
# The separator fg color should match the section background it's "drawing"
set -g status-right "#[bg=default,fg=$light2,bold]#(cd #{pane_current_path}; branch=\$(git rev-parse --abbrev-ref HEAD 2>/dev/null); [ -n \"\$branch\" ] && echo \"  \$branch \")#[bg=default,fg=$dark1]#[bg=$dark1,fg=$light2]  %H:%M - %a %d #[fg=#{?client_prefix,$bright_yellow,$light2},bg=$dark1]#[bg=#{?client_prefix,$bright_yellow,$light2},fg=$dark0,bold] #{?SSH_CONNECTION,󰢹 remote,󰇄 local} "
set -g status-right-length 100

# Window status styling (matching tab styling)
# Inactive tabs: just the index with minimal styling
set -g window-status-format "#[bg=default,fg=$light3]  #I "
# Active tab: rounded with dark0 background (different from session which uses dark1)
set -g window-status-current-format " #[fg=$dark1,bg=default]#[bg=$dark1,fg=$light2,bold] #I #W #[fg=$dark1,bg=default]"
set -g window-status-separator ""
set -g window-status-activity-style "fg=$light3,bg=default"

set -g base-index 1           # start windows numbering at 1
setw -g pane-base-index 1     # make pane numbering consistent with windows

setw -g automatic-rename on   # rename window to reflect current program
set -g renumber-windows on    # renumber windows when a window is closed

set -g set-titles on          # set terminal title

set -g display-panes-time 800 # slightly longer pane indicators display time
set -g display-time 1000      # slightly longer status messages display time

set -g status-interval 10     # redraw status line every 10 seconds
set -g mouse on

# clear both screen and history
bind -n C-l send-keys C-l \; run 'sleep 0.2' \; clear-history

# activity
set -g monitor-activity on
set -g visual-activity off


# -- navigation ----------------------------------------------------------------

# create session
bind n new-session

# find session
bind C-f command-prompt -p find-session 'switch-client -t %%'

# session navigation
bind Tab switch-client -l  # move to last session

# split current window horizontally
bind - split-window -v
# split current window vertically
bind _ split-window -h

# maximize current pane
bind + run "cut -c3- '#{TMUX_CONF}' | sh -s _maximize_pane '#{session_name}' '#D'"

# window navigation
unbind n
unbind p
bind -n M-[ swap-window -t -1 \; select-window -t -1  # swap current window with the previous one
bind -n M-] swap-window -t +1 \; select-window -t +1  # swap current window with the next one
bind -n M-t new-window -c "#{pane_current_path}"
bind x kill-window

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -r h select-pane -L  # move left
bind -r j select-pane -D  # move down
bind -r k select-pane -U  # move up
bind -r l select-pane -R  # move right
bind > swap-pane -D       # swap current pane with the next one
bind < swap-pane -U       # swap current pane with the previous one

# -- copy mode -----------------------------------------------------------------

bind Enter copy-mode # enter copy mode

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line

# copy to X11 clipboard
if -b 'command -v xsel > /dev/null 2>&1' 'bind y run -b "\"\$TMUX_PROGRAM\" \${TMUX_SOCKET:+-S \"\$TMUX_SOCKET\"} save-buffer - | xsel -i -b"'
if -b '! command -v xsel > /dev/null 2>&1 && command -v xclip > /dev/null 2>&1' 'bind y run -b "\"\$TMUX_PROGRAM\" \${TMUX_SOCKET:+-S \"\$TMUX_SOCKET\"} save-buffer - | xclip -i -selection clipboard >/dev/null 2>&1"'
# copy to Wayland clipboard
if -b '[ "$XDG_SESSION_TYPE" = "wayland" ] && command -v wl-copy > /dev/null 2>&1' 'bind y run -b "\"\$TMUX_PROGRAM\" \${TMUX_SOCKET:+-S \"\$TMUX_SOCKET\"} save-buffer - | wl-copy"'
# copy to macOS clipboard
if -b 'command -v pbcopy > /dev/null 2>&1' 'bind y run -b "\"\$TMUX_PROGRAM\" \${TMUX_SOCKET:+-S \"\$TMUX_SOCKET\"} save-buffer - | pbcopy"'
# copy to Windows clipboard
if -b 'command -v clip.exe > /dev/null 2>&1' 'bind y run -b "\"\$TMUX_PROGRAM\" \${TMUX_SOCKET:+-S \"\$TMUX_SOCKET\"} save-buffer - | clip.exe"'
if -b '[ -c /dev/clipboard ]' 'bind y run -b "\"\$TMUX_PROGRAM\" \${TMUX_SOCKET:+-S \"\$TMUX_SOCKET\"} save-buffer - > /dev/clipboard"'

# -- buffers -------------------------------------------------------------------

bind b list-buffers     # list paste buffers
bind p paste-buffer -p  # paste from the top paste buffer
bind P choose-buffer    # choose which buffer to paste from
