# Binds

map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9
map alt+0 goto_tab 10

map page_up scroll_page_up
map page_down scroll_page_down

map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+u scroll_page_up
map ctrl+shift+d scroll_page_down
map ctrl+v paste_from_clipboard

map ctrl+backspace send_text all \x17

map ctrl+alt+s save_as_session
map ctrl+shift+1 goto_session ~/.configs/kitty/sessions/1.kitty-session
map ctrl+shift+2 goto_session ~/.configs/kitty/sessions/2.kitty-session
map ctrl+shift+3 goto_session ~/.configs/kitty/sessions/3.kitty-session
map ctrl+shift+4 goto_session ~/.configs/kitty/sessions/4.kitty-session
map ctrl+shift+5 goto_session ~/.configs/kitty/sessions/5.kitty-session
map ctrl+shift+6 goto_session ~/.configs/kitty/sessions/6.kitty-session
map ctrl+shift+7 goto_session ~/.configs/kitty/sessions/7.kitty-session
map ctrl+shift+8 goto_session ~/.configs/kitty/sessions/8.kitty-session
map ctrl+shift+9 goto_session ~/.configs/kitty/sessions/9.kitty-session
map ctrl+shift+0 goto_session ~/.configs/kitty/sessions/0.kitty-session

